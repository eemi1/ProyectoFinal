name: Flyway Auto Sync

on:
  push:
    branches:
      - main
    paths:
      - '**/*.sql'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Connect to server and update database
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.SERVER_PATH }}
            git pull origin main
            /usr/local/bin/flyway -configFiles=${{ secrets.SERVER_PATH }}/admin_scripts/db/flyway.conf migrate
