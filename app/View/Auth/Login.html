<!DOCTYPE html>
<html lang="es" class="scrollbar-hide">
    <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fory Factory | Iniciar Sesión</title>
    <meta charset="UTF-8" />
        <link rel="icon" href="../../../images/logo.jpg" type="image/x-icon">
        <link rel="stylesheet" href="../../../resources/css/pages/Auth/login.css" type="text/css">
        <link rel="stylesheet" href="../../../resources/css/components.css" type="text/css">
        <link rel="stylesheet" href="../../../resources/css/parts/nav.css" type="text/css">
        <link rel="stylesheet" href="../../../resources/css/parts/footer.css" type="text/css">
        <script src="https://kit.fontawesome.com/29724e3467.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&family=Rasa:ital,wght@0,300..700;1,300..700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    </head>

<body>
    <header class="header"></header>

    <main>
        <div class="imgContainer">
            <img src="images/bg/bg-register.jpg"> 
        </div>
        <div class="formContainer">

            <div class="formHeader">
                <h5>¡Bienvenido de nuevo!</h5>
                <p>Inicia sesión aquí</p>
            </div>
            <div class="formContent">
                <form class="form" action="app/Functions/Auth/LoginController.php">

                    <div class="formAuth">
                        <label for="email">Dirección de correo electrónico</label>
                        <div class="inputContainer">
                            <svg class="input-icon" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
                                <path d="M207.8 20.73c-93.45 18.32-168.7 93.66-187 187.1c-27.64 140.9 68.65 266.2 199.1 285.1c19.01 2.888 36.17-12.26 36.17-31.49l.0001-.6631c0-15.74-11.44-28.88-26.84-31.24c-84.35-12.98-149.2-86.13-149.2-174.2c0-102.9 88.61-185.5 193.4-175.4c91.54 8.869 158.6 91.25 158.6 183.2l0 16.16c0 22.09-17.94 40.05-40 40.05s-40.01-17.96-40.01-40.05v-120.1c0-8.847-7.161-16.02-16.01-16.02l-31.98 .0036c-7.299 0-13.2 4.992-15.12 11.68c-24.85-12.15-54.24-16.38-86.06-5.106c-38.75 13.73-68.12 48.91-73.72 89.64c-9.483 69.01 43.81 128 110.9 128c26.44 0 50.43-9.544 69.59-24.88c24 31.3 65.23 48.69 109.4 37.49C465.2 369.3 496 324.1 495.1 277.2V256.3C495.1 107.1 361.2-9.332 207.8 20.73zM239.1 304.3c-26.47 0-48-21.56-48-48.05s21.53-48.05 48-48.05s48 21.56 48 48.05S266.5 304.3 239.1 304.3z"></path>
                            </svg>
                            <input type="email" id="email" name="email" placeholder="Ingresar email" autocomplete="email" required>
                        </div>
                    </div>
                    <div class="formAuth">
                        <label for="password">Contraseña</label>
                        <div class="inputContainer">
                            <svg class="input-icon" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
                                <path d="M80 192V144C80 64.47 144.5 0 224 0C303.5 0 368 64.47 368 144V192H384C419.3 192 448 220.7 448 256V448C448 483.3 419.3 512 384 512H64C28.65 512 0 483.3 0 448V256C0 220.7 28.65 192 64 192H80zM144 192H304V144C304 99.82 268.2 64 224 64C179.8 64 144 99.82 144 144V192z"></path>
                            </svg>
                            <input type="password" id="password" name="password" placeholder="Ingresar contraseña" autocomplete="password" required>
                        </div>
                    </div>
                    <div class="submitContainer">
                        <button type="submit" class="submitForm">Iniciar sesión</button>
                    </div>

                    <label class="noRegister">
                    ¿No tienes una cuenta?
                        <a href="Register.html" class="register">Crea una cuenta aquí</a>
                    </label>
                </form>
            </div>
            <div class="formFooter">
                <div class="divisorOrWith">
                    <hr>
                    <p>O con:</p>
                    <hr>
                </div>   
                <script src="https://accounts.google.com/gsi/client" async defer></script>   
                <!-- Configuración de Google -->
                <div class="ContinueWithGoogle">
                    <div id="g_id_onload"
                        data-client_id="350728797977-cv03e2jicnvf65ot0acjb4q7l265r8qu.apps.googleusercontent.com"
                        data-context="signin"
                        data-ux_mode="redirect"
                        data-login_uri="http://localhostapp/Functions/config/authGoogle.php"
                        data-auto_prompt="false">
                    </div>

                    <!-- Botón de Google -->
                    <div class="g_id_signin"
                        data-type="standard"
                        data-shape="rectangular"
                        data-theme="outline"
                        data-text="continue_with"
                        data-size="large"
                        data-logo_alignment="left">
                    </div>
                </div>
            </div>
        </div>


    </main>
    




    <footer class="footer"></footer>
    <script src="../../../resources/js/main.js"></script>
    <script src="../../../resources/js/Auth/Login.js"></script>
</body>
</html>
