<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/proyectoFinal/images/logo.jpg" type="image/x-icon">
<title>Fory Factory | Reservas</title>
<script src="https://kit.fontawesome.com/29724e3467.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="/proyectoFinal/resources/css/components.css" type="text/css">
<link rel="stylesheet" href="/proyectoFinal/resources/css/pages/Reservation/reservation.css">
<link rel="stylesheet" href="../../../resources/css/parts/nav.css" type="text/css">
<link rel="stylesheet" href="../../../resources/css/parts/footer.css" type="text/css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>
<body>
    <header></header>

    <main>
        <div class="containerForm">
            <div class="formContent">
                <div class="formHeader">
                    <h5><i class="fa-regular fa-calendar"></i>Nueva Reserva</h5>
                    <p>Reserva tu mesa en nuestro restaurante</p>
                </div>
                <form class="form" action="/proyectoFinal/app/Functions/reservations/addReservation.php" method="POST">
                    <div class="formContainer">
                        <label for="date"><i class="fa-regular fa-calendar"></i>Fecha *</label>
                        <div class="inputContainer">
                            <input type="date" name="date" id="date" min="" placeholder="Selecciona una fecha" required>
                        </div>
                    </div>

                    <div class="formContainer">
                        <label for="time"><i class="fa-regular fa-calendar"></i>Hora *</label>
                        <div class="inputContainer">
                            <select name="time" id="time" required>
                                <option value="default">Selecciona una hora *</option>
                                <option value="12:00">12:00</option>
                                <option value="12:30">12:30</option>
                                <option value="13:00">13:00</option>
                                <option value="13:30">13:30</option>
                                <option value="14:00">14:00</option>
                                <option value="14:30">14:30</option>
                                <option value="15:00">15:00</option>
                                <option value="20:00">20:00</option>
                                <option value="20:30">20:30</option>
                                <option value="21:00">21:00</option>
                                <option value="21:30">21:30</option>
                                <option value="22:00">22:00</option>
                                <option value="22:30">22:30</option>
                                <option value="23:00">23:00</option>
                                <option value="23:30">23:30</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="formContainer" id="numberPeopleContainer">
                        <label><i class="fa-solid fa-users"></i>Número de personas</label>
                        <div class="inputContainer">
                            <select name="numberPeople" id="numberPeople">
                                <option value="default" class="default">Seleccionar cantidad</option>
                                <option value="1" class="">1 persona</option>
                                <option value="2" class="">2 persona</option>
                                <option value="3" class="">3 persona</option>
                                <option value="4" class="">4 persona</option>
                                <option value="5" class="">5 persona</option>
                                <option value="6" class="">6 persona</option>
                                <option value="7" class="">7 persona</option>
                                <option value="8" class="">8 persona</option>
                            </select>
                        </div>
                    </div>

                    <div class="formContainer" id="tableAvailabilityContainer">
                        <div class="inputContainer">
                            <label>Disponibilidad de Mesas</label>
                            <div class="tableAvailability">
                                <div id="mesaContainer"></div>
                                <input type="hidden" name="mesa" id="selectedMesa">

                                
                            </div>
                            <div class="tableFooter"></div>

                        </div>
                    </div>

                    <div class="formContainer formColumn" >
                        <label for="name"><i class="fa-regular fa-user"></i>Nombre completo *</label>
                        <div class="inputContainer">
                            <input type="text" name="name" id="name" placeholder="Tu nombre" required>
                        </div>
                    </div>

                    <div class="formContainer formColumn" >
                        <label for="phone"><i class="fa-solid fa-phone"></i>Teléfono *</label>
                        <div class="inputContainer">
                            <input type="text" name="phone" id="name" placeholder="+598 99 999 999" required>
                        </div>
                    </div>

                    <div class="formContainer formColumn" >
                        <label for="email"><i class="fa-regular fa-envelope"></i>Email *</label>
                        <div class="inputContainer">
                            <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                        </div>
                    </div>

                    <div class="formContainer formColumn" >
                        <label for="notes"><i class="fa-regular fa-note-sticky"></i>Notas especiales (opcional)</label>
                        <div class="inputContainer">
                            <textarea name="notes" id="notes" placeholder="Alergias, preferencias de mesa, celebraciones..."></textarea>
                        </div>
                    </div>

                    <div class="formContainer formColumn">
                        <button type="submit" class="formSubmit">Confirmar Reserva</button>
                    </div>
                </form>
            </div>

        </div>
        <div class="containerReservations">
            <div class="reservationContent"></div>

        </div>
    </main>


    <footer></footer>
    <script src="/proyectoFinal/resources/js/main.js"></script>
    <script src="/proyectoFinal/resources/js/Reservation/reservation.js"></script>
</body>
</html>
